# exclusion-patterns.yaml — replication discovery
# Source: ported VERBATIM from apps/worker/src/services/replication/phraseDetection.ts:24-29
# (NON_SCHOLARLY_REPLICATION_CONTEXTS).
#
# Applied as POST-fetch filter on title + abstract — no API supports negative regex
# search reliably. If any pattern matches, the candidate is dropped before reaching
# the classifier.
#
# Spec: docs/superpowers/specs/2026-05-04-replication-discovery-design.md §3.3
version: 1

patterns:
  - id: BIOLOGICAL
    regex: '\b(?:dna|rna|mrna|cdna|viral|\w*virus(?:es)?|hiv|sars[-\s]?cov[-\s]?2?|influenza|bacteri\w+|mycobacteri\w+|pathogens?|parasites?|prions?|phages?|cell|cellular|chromosome|plasmid|genome|genomic|mitochondrial)\s+replication\b'
    flags: [i]
    description: >
      "<organism> replication" — biology, not psychology. The named-pathogen terms
      (hiv, sars-cov-2, influenza, <x>virus) were added because the original
      dna/rna/viral/virus list missed titles like "Suppression of HIV-1 Replication".

  - id: TECHNICAL_OBJECT
    regex: '\b(?:replication of (?:the )?(?:apparatus|code|dataset|data|database|model|method|pipeline|protocol|software|simulation)|(?:apparatus|code|dataset|data|database|model|method|pipeline|protocol|software|simulation)\s+replication)\b'
    flags: [i]
    description: "code/data/method replication (both 'replication of X' and 'X replication' forms), not psychological"

  - id: TECHNICAL_VERB
    regex: '\breplicat(?:e|ed|ing)\s+(?:the )?(?:apparatus|code|dataset|data|database|model|method|pipeline|protocol|software|simulation)\b'
    flags: [i]
    description: "verb form of technical replication"

  - id: STRUCTURAL
    regex: '\breplication (?:fork|origin|stress|timing)\b'
    flags: [i]
    description: "molecular biology structural terms"

  - id: BIOLOGICAL_OF
    regex: '\breplication of (?:the\s+)?(?:(?!(?:study|studies|experiments?|effects?|findings?|results?|analys[ei]s|papers?|trials?|surveys?)\b)\w+[-\s]+){0,3}(?:(?:dna|rna|mrna|cdna|viral|\w*virus(?:es)?|bacteri\w+|mycobacteri\w+|pathogens?|prions?|phages?|chromosomes?|plasmids?|genomes?|genomic|hiv|sars[-\s]?cov[-\s]?2?|influenza|mitochondrial|organoids?)\b|(?:cells?|cellular|parasites?)\b(?=\s*(?:[.,;:)\]]|$|\b(?:in|by|during|within|with|and|or|is|are|was|were|from|to|at|under)\b)))'
    flags: [i]
    description: >
      "replication of <organism>" word order. BIOLOGICAL only covers "<organism>
      replication", so virology abstracts phrased "the replication of enteroviruses"
      passed the filter — one duplicated cluster of these accounted for 106 of the
      501 rows Stage 3 later screened out as not-a-replication. Up to three filler
      words are allowed before the organism ("Replication of Oncolytic Herpes
      Simplex Virus").

      cell/cellular/parasite are split out and must be the HEAD of the phrase —
      followed by punctuation, end, or a preposition/verb. They have common
      non-biological collocations, and with a three-word filler window the
      unrestricted form killed genuine replications outright: "a direct replication
      of the classic CELL PHONE driving study" and "a conceptual replication of the
      PARASITE STRESS theory of values" both became false_positive, which is
      terminal. The unambiguous organism terms need no such restriction.

      The filler window also refuses study-nouns, so "a replication of the original
      STUDY in cells" keeps its real head ("study") and survives. Without that, a
      replication merely CONDUCTED in biological material was excluded.

  - id: EDITORIAL_ARTIFACT
    regex: '^\s*(?:review for|decision letter for|peer review #|faculty opinions recommendation of|correction to|author response)\b'
    flags: [i]
    description: >
      Peer-review records and editorial artifacts echo a real replication paper's
      title verbatim, so every replication phrase in the title fires on a record
      that is not the study.

  - id: DATA_AVAILABILITY
    regex: '\b(?:data|code|scripts?|files?|materials?|repositor\w+|replication package)\b(?=[^.\n]{0,200}\b(?:available|provided|deposited|archived|posted|shared|supplement\w*|repositor\w+|osf|github|dataverse|zenodo|figshare|doi\.org)\b)[^.\n]{0,80}?\bto\s+(?:replicate|reproduce)\b'
    flags: [i]
    description: >
      Dataverse/OSF/GitHub boilerplate — "data and code are available on OSF to
      reproduce the results in this paper" — describes the paper's OWN
      reproducibility package, not a reproduction of someone else's study.

      An availability anchor (available/deposited/OSF/GitHub/...) is REQUIRED, and is
      looked for anywhere in the same sentence — it may follow the verb, as in "data
      and code to reproduce the results in this paper are on OSF". Without the anchor
      the pattern matched ordinary methods prose: "Data from the published experiment
      were used to replicate the main result" is a genuine reproduction and was being
      made false_positive, which is terminal. Every gap excludes newlines as well as
      full stops, so it cannot bridge the title/abstract join.
